title: Verity · 个人博客
description: 记录编程、数学与写作的个人博客
lang: zh-CN
timezone: Asia/Shanghai
author: Verity
email: 1362691318@qq.com
github_username: VERITY077
markdown: kramdown
permalink: /posts/:title/
url: https://verity077.github.io
# 项目站点必须填仓库名，否则 relative_url 拼不出 /nice-template 前缀，
# 页面里的 CSS、文章链接都会 404。若改用 <用户名>.github.io 根仓库，这里改回 ""。
baseurl: "/nice-template"

# 「学习资料」页面的 AI 后端地址（跨域绝对地址）。
# 留空时页面可正常打开，但会显示「后端尚未接入」，不会发起任何上传。
# 部署 worker/ 后填 Worker 的 HTTPS 地址，例如 https://verity-study.<subdomain>.workers.dev
study_api_base: ""

# 前端允许选择的文件限制（后端还有自己的上限，两者需一致或前端更严格）
study_max_files: 3
study_max_file_mb: 5
study_max_total_mb: 10

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  # 后端代码不参与站点构建，也不应被发布到 Pages
  - worker
  - .env
  - .env.local
